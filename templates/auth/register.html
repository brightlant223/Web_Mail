{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg p-4 p-md-5 rounded-5 glass-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-accent bg-opacity-10 text-accent rounded-circle mb-3" style="width: 65px; height: 65px; background: rgba(139,92,246,0.1);">
                    <i class="fas fa-at fs-2 text-primary"></i>
                </div>
                <h3 class="fw-bolder text-dark mb-1">Create Domain Mailbox</h3>
                <p class="text-muted small">Generate your personalized company email account</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">Your Full Name</label>
                    <input type="text" name="name" class="form-control form-control-custom" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">Desired Username & Domain</label>
                    <div class="input-group">
                        <input type="text" name="username" class="form-control form-control-custom text-end" placeholder="rahul" required>
                        <span class="input-group-text bg-light border-0 fw-bold">@</span>
                        <select name="domain_id" class="form-select form-control-custom" required>
                            {% for d in domains %}
                                <option value="{{ d.id }}">{{ d.domain_name }}</option>
                            {% else %}
                                <option value="">No Active Domain Available</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small">Account Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="btn btn-primary-gradient w-100 py-3 rounded-4 fw-bold fs-6 shadow-sm mb-3">
                    <i class="fas fa-user-check me-2"></i> Register Mailbox Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
