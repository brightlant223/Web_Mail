{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg p-4 p-md-5 rounded-5 glass-card text-center">
            <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 65px; height: 65px;">
                <i class="fas fa-key fs-2"></i>
            </div>
            <h3 class="fw-bolder text-dark mb-1">Reset Password</h3>
            <p class="text-muted small mb-4">Enter your domain email address to receive password reset instructions.</p>

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="mb-4 text-start">
                    <label class="form-label fw-bold text-muted small">Registered Email</label>
                    <input type="email" name="email" class="form-control form-control-custom" placeholder="name@domain.com" required>
                </div>

                <button type="submit" class="btn btn-primary-gradient w-100 py-3 rounded-4 fw-bold fs-6 shadow-sm mb-3">
                    Send Reset Link
                </button>
            </form>

            <a href="{{ url_for('login') }}" class="text-muted small text-decoration-none fw-bold">
                <i class="fas fa-arrow-left me-1"></i> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
